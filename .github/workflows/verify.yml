name: Verify arcade release
on: [push, pull_request]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            MAGA-everything/02-code/armor-games/package-lock.json
      - run: npm run setup
      - run: npx playwright install --with-deps chromium firefox
      - name: Select test browser
        run: node --input-type=module -e 'import { chromium } from "@playwright/test"; console.log("CHROMIUM_PATH=" + chromium.executablePath())' >> "$GITHUB_ENV"
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            verification/browser-report/
            test-results/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: armor-arcade-private-release
          path: dist/
          retention-days: 14
